<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🚗 Car Rental Admin</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>
  <div id="loginView" class="auth-view">
    <div class="auth-card">
      <h2>Car Rental Admin</h2>
      <p>Sign in with a staff account</p>
      <form id="loginForm">
        <input id="loginEmail" type="email" placeholder="Email" required />
        <input id="loginPassword" type="password" placeholder="Password" required />
        <button class="btn btn-primary" type="submit">Login</button>
      </form>
      <div id="loginError" class="auth-error"></div>
    </div>
  </div>

  <div id="appShell" class="auth-hidden">
  <!-- ── SIDEBAR ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <i class="fas fa-car"></i>
      <span data-i18n="appTitle">Car Rental Admin</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="dashboard">
        <i class="fas fa-tachometer-alt"></i> <span data-i18n="nav_dashboard">Dashboard</span>
      </a>
      <a href="#" class="nav-item" data-page="branches">
        <i class="fas fa-code-branch"></i> <span data-i18n="nav_branches">Branches</span>
      </a>
      <a href="#" class="nav-item" data-page="car_categories">
        <i class="fas fa-tags"></i> <span data-i18n="nav_car_categories">Car Categories</span>
      </a>
      <a href="#" class="nav-item" data-page="car_status">
        <i class="fas fa-traffic-light"></i> <span data-i18n="nav_car_status">Car Status</span>
      </a>
      <a href="#" class="nav-item" data-page="cars">
        <i class="fas fa-car-side"></i> <span data-i18n="nav_cars">Cars</span>
      </a>
      <a href="#" class="nav-item" data-page="customers">
        <i class="fas fa-users"></i> <span data-i18n="nav_customers">Customers</span>
      </a>
      <a href="#" class="nav-item" data-page="profile">
        <i class="fas fa-user-circle"></i> <span data-i18n="nav_profile">Profile</span>
      </a>
      <a href="#" class="nav-item staff-nav" data-page="staff">
        <i class="fas fa-user-tie"></i> <span data-i18n="nav_staff">Staff</span>
      </a>
      <a href="#" class="nav-item" data-page="reservations">
        <i class="fas fa-calendar-check"></i> <span data-i18n="nav_reservations">Reservations</span>
      </a>
      <a href="#" class="nav-item" data-page="rentals">
        <i class="fas fa-key"></i> <span data-i18n="nav_rentals">Rentals</span>
      </a>
      <a href="#" class="nav-item" data-page="payments" data-module="payments">
        <i class="fas fa-credit-card"></i> <span data-i18n="nav_payments">Payments</span>
      </a>
      <a href="#" class="nav-item" data-page="maintenance" data-module="maintenance">
        <i class="fas fa-wrench"></i> <span data-i18n="nav_maintenance">Maintenance</span>
      </a>
      <a href="#" class="nav-item admin-nav" data-page="role_access" data-module="role_access">
        <i class="fas fa-user-shield"></i> <span>Role Access</span>
      </a>
    </nav>
  </aside>

  <!-- ── MAIN CONTENT ── -->
  <div class="main-wrapper">

    <!-- Top Bar -->
    <header class="topbar">
      <button class="toggle-btn" id="toggleSidebar">
        <i class="fas fa-bars"></i>
      </button>
      <h1 class="page-title" id="pageTitle">Dashboard</h1>
      <div class="topbar-right">
        <span id="currentUserLabel" class="badge-api">Not signed in</span>
        <span class="badge-api" id="apiStatus" data-i18n="apiConnected">
          <i class="fas fa-circle"></i> API Connected
        </span>
        <select id="langSelect" class="lang-select" aria-label="Language">
          <option value="en">English</option>
          <option value="fr" selected>Français</option>
        </select>
        <button class="btn btn-secondary" id="logoutBtn" type="button">Logout</button>
      </div>
    </header>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <!-- Page Content -->
    <main class="content" id="pageContent">
      <!-- Dynamically loaded -->
    </main>

  </div>

  <!-- ── MODAL ── -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Form</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Dynamic form -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modalCancel" data-i18n="btn_cancel">Cancel</button>
        <button class="btn btn-primary" id="modalSubmit" data-i18n="btn_save">Save</button>
      </div>
    </div>
  </div>

  </div>

  <!-- Scripts -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/login.js"></script>
  <script src="/static/js/auth-bootstrap.js"></script>
  <script src="/static/js/pages/branches.js"></script>
  <script src="/static/js/pages/car_categories.js"></script>
  <script src="/static/js/pages/car_status.js"></script>
  <script src="/static/js/pages/cars.js"></script>
  <script src="/static/js/pages/customers.js"></script>
  <script src="/static/js/pages/profile.js"></script>
  <script src="/static/js/pages/staff.js"></script>
  <script src="/static/js/pages/role_access.js"></script>
  <script src="/static/js/pages/reservations.js"></script>
  <script src="/static/js/pages/rentals.js"></script>
  <script src="/static/js/pages/payments.js"></script>
  <script src="/static/js/pages/maintenance.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
